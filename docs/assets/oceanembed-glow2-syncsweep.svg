<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 116" width="610" height="116" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="g2-border" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45C4D6"/>
      <stop offset="40%" stop-color="#0A5A78"/>
      <stop offset="75%" stop-color="#06445C"/>
      <stop offset="100%" stop-color="#14212B"/>
    </linearGradient>

    <!-- Deep Ocean Water Column Gradient -->
    <linearGradient id="g2-water" x1="48" y1="6" x2="48" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1728"/>
      <stop offset="50%" stop-color="#0A1222"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </linearGradient>

    <!-- Unified Synchronous Wavefront Gradient -->
    <linearGradient id="g2-wavefront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45C4D6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#45C4D6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#45C4D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#45C4D6" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Oceanic Aura -->
    <radialGradient id="g2-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#45C4D6" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0A5A78" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070D1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Ambient Breathing Background */
    @keyframes g2AuraPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.96); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    .g2-aura {
      transform-origin: 48px 48px;
      animation: g2AuraPulse 3.0s ease-in-out infinite;
    }

    /* Synchronous Wavefront: Sweeps horizontally across all 3 strata together */
    @keyframes g2WavefrontSweep {
      0% { transform: translateX(-35px); opacity: 0; }
      5% { opacity: 1; }
      48% { transform: translateX(65px); opacity: 1; }
      55% { transform: translateX(65px); opacity: 0; }
      100% { transform: translateX(65px); opacity: 0; }
    }
    .g2-wavefront-light {
      animation: g2WavefrontSweep 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Synchronous Glowing: All 3 bars glow intensely as the wavefront passes */
    @keyframes g2SurfaceGlow {
      0% { filter: none; }
      6% { filter: drop-shadow(0 0 8px #FFFFFF) drop-shadow(0 0 16px rgba(255, 255, 255, 0.7)); }
      28% { filter: drop-shadow(0 0 14px #FFFFFF) drop-shadow(0 0 24px rgba(69, 196, 214, 0.95)); }
      50% { filter: drop-shadow(0 0 6px #FFFFFF); }
      58% { filter: none; }
      100% { filter: none; }
    }

    @keyframes g2ThermoGlow {
      0% { filter: none; }
      6% { filter: drop-shadow(0 0 8px #45C4D6) drop-shadow(0 0 16px rgba(69, 196, 214, 0.7)); }
      26% { filter: drop-shadow(0 0 14px #45C4D6) drop-shadow(0 0 26px rgba(69, 196, 214, 1.0)); }
      42% { filter: drop-shadow(0 0 6px #45C4D6); }
      48% { filter: none; }
      100% { filter: none; }
    }

    @keyframes g2AbyssGlow {
      0% { filter: none; opacity: 0.55; }
      6% { filter: drop-shadow(0 0 8px #0A5A78) drop-shadow(0 0 14px rgba(69, 196, 214, 0.7)); opacity: 0.85; }
      22% { filter: drop-shadow(0 0 12px #45C4D6) drop-shadow(0 0 20px rgba(10, 90, 120, 0.9)); opacity: 1.0; }
      34% { filter: drop-shadow(0 0 6px #0A5A78); opacity: 0.75; }
      40% { filter: none; opacity: 0.55; }
      100% { filter: none; opacity: 0.55; }
    }

    .g2-bar-surface { animation: g2SurfaceGlow 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .g2-bar-thermo { animation: g2ThermoGlow 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .g2-bar-abyss { animation: g2AbyssGlow 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

    /* Typography */
    .oe-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 72px;
      letter-spacing: -1.2px;
    }
    .oe-ocean { font-weight: 600; fill: #FFFFFF; }
    .oe-embed { font-weight: 600; fill: #45C4D6; }

    /* Light Theme Adaptation */
    @media (prefers-color-scheme: light) {
      .g2-casing-bg { fill: #F7F6F2 !important; stroke: #0A5A78 !important; }
      .g2-bar-surface { stroke: #14212B !important; }
      .g2-bar-thermo { stroke: #0A5A78 !important; }
      .g2-bar-abyss { stroke: #0A5A78 !important; }
      .oe-ocean { fill: #14212B !important; }
      .oe-embed { fill: #0A5A78 !important; }
    }
  </style>

  <!-- Lockup Container (viewBox 610x116, translate 18, 10) -->
  <g transform="translate(18, 10)">
    <!-- Emblem Container (84x84) -->
    <g transform="translate(0, 0)">
      <!-- Ambient Oceanic Aura -->
      <ellipse cx="48" cy="48" rx="54" ry="54" fill="url(#g2-aura)" class="g2-aura"/>

      <!-- Clean Squircle Enclosure -->
      <rect x="6" y="6" width="84" height="84" rx="22"
            fill="url(#g2-water)"
            stroke="url(#g2-border)"
            stroke-width="4.5"
            stroke-linejoin="round"
            class="g2-casing-bg"/>

      <!-- Inner Subtle Border Highlight -->
      <rect x="9.5" y="9.5" width="77" height="77" rx="19"
            fill="none"
            stroke="#45C4D6"
            stroke-width="0.8"
            stroke-opacity="0.35"/>

      <!-- Combined Strata Clip Path for the Synchronous Wavefront -->
      <clipPath id="g2-strata-clip">
        <rect x="18.5" y="29.5" width="59" height="7" rx="3.5"/>
        <rect x="18.5" y="44.5" width="41" height="7" rx="3.5"/>
        <rect x="18.5" y="59.5" width="23" height="7" rx="3.5"/>
      </clipPath>

      <!-- Layer 1: Sea Surface (0m) - Preserved Original White Color -->
      <line x1="22" y1="33" x2="74" y2="33"
            stroke="#FFFFFF"
            stroke-width="7.0"
            stroke-linecap="round"
            class="g2-bar-surface"/>

      <!-- Layer 2: Thermocline (50-200m) - Preserved Original Cyan Color -->
      <line x1="22" y1="48" x2="56" y2="48"
            stroke="#45C4D6"
            stroke-width="7.0"
            stroke-linecap="round"
            class="g2-bar-thermo"/>

      <!-- Layer 3: Abyss (1000m) - Preserved Original Deep Navy 55% -->
      <line x1="22" y1="63" x2="38" y2="63"
            stroke="#0A5A78"
            stroke-width="7.0"
            stroke-linecap="round"
            opacity="0.55"
            class="g2-bar-abyss"/>

      <!-- Synchronous Wavefront Glint sweeping across all 3 layers together -->
      <g clip-path="url(#g2-strata-clip)">
        <rect x="22" y="28" width="30" height="42" fill="url(#g2-wavefront)" class="g2-wavefront-light"/>
      </g>
    </g>

    <!-- Wordmark "OceanEmbed" (72px, guaranteed zero cutoff with 610px width) -->
    <text x="116" y="74" class="oe-wordmark">
      <tspan class="oe-ocean">Ocean</tspan><tspan class="oe-embed">Embed</tspan>
    </text>
  </g>
</svg>
