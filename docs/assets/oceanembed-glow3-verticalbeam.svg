<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 116" width="610" height="116" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="g3-border" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45C4D6"/>
      <stop offset="40%" stop-color="#0A5A78"/>
      <stop offset="75%" stop-color="#06445C"/>
      <stop offset="100%" stop-color="#14212B"/>
    </linearGradient>

    <!-- Deep Ocean Water Column Gradient -->
    <linearGradient id="g3-water" x1="48" y1="6" x2="48" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1728"/>
      <stop offset="50%" stop-color="#0A1222"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </linearGradient>

    <!-- Vertical Penetration Beam Gradient -->
    <linearGradient id="g3-beam-grad" x1="0" y1="0%" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#45C4D6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#45C4D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#45C4D6" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Oceanic Aura -->
    <radialGradient id="g3-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#45C4D6" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#0A5A78" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070D1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Ambient Breathing Background */
    @keyframes g3AuraPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.96); }
      50% { opacity: 0.8; transform: scale(1.06); }
    }
    .g3-aura {
      transform-origin: 48px 48px;
      animation: g3AuraPulse 3.2s ease-in-out infinite;
    }

    /* Vertical Sounding Beam: Drops straight down from surface to abyss */
    @keyframes g3VerticalBeamMotion {
      0% { transform: translateY(-20px); opacity: 0; }
      5% { opacity: 1; }
      70% { transform: translateY(46px); opacity: 1; }
      78% { transform: translateY(46px); opacity: 0; }
      100% { transform: translateY(46px); opacity: 0; }
    }
    .g3-vertical-beam {
      animation: g3VerticalBeamMotion 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }

    /* Depth-Sounding Stratum Glows: Each layer blooms as the downward beam penetrates it */
    /* 1. Surface blooms when beam hits top (5% - 30%) */
    @keyframes g3SurfaceGlow {
      0% { filter: none; }
      6% { filter: drop-shadow(0 0 12px #FFFFFF) drop-shadow(0 0 22px rgba(69, 196, 214, 0.95)); }
      25% { filter: drop-shadow(0 0 10px #FFFFFF) drop-shadow(0 0 18px rgba(69, 196, 214, 0.7)); }
      32% { filter: none; }
      100% { filter: none; }
    }

    /* 2. Thermocline blooms as beam sinks to mid-depth (30% - 55%) */
    @keyframes g3ThermoGlow {
      0%, 26% { filter: none; }
      32% { filter: drop-shadow(0 0 14px #45C4D6) drop-shadow(0 0 24px rgba(69, 196, 214, 1.0)); }
      50% { filter: drop-shadow(0 0 10px #45C4D6) drop-shadow(0 0 18px rgba(69, 196, 214, 0.75)); }
      58% { filter: none; }
      100% { filter: none; }
    }

    /* 3. Abyss blooms as beam reaches seafloor (55% - 80%) */
    @keyframes g3AbyssGlow {
      0%, 50% { filter: none; opacity: 0.55; }
      58% { filter: drop-shadow(0 0 12px #45C4D6) drop-shadow(0 0 20px rgba(10, 90, 120, 0.95)); opacity: 1.0; }
      74% { filter: drop-shadow(0 0 8px #45C4D6); opacity: 0.9; }
      82% { filter: none; opacity: 0.55; }
      100% { filter: none; opacity: 0.55; }
    }

    .g3-bar-surface { animation: g3SurfaceGlow 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite; }
    .g3-bar-thermo { animation: g3ThermoGlow 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite; }
    .g3-bar-abyss { animation: g3AbyssGlow 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite; }

    /* Typography */
    .oe-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 72px;
      letter-spacing: -1.2px;
    }
    .oe-ocean { font-weight: 600; fill: #FFFFFF; }
    .oe-embed { font-weight: 600; fill: #45C4D6; }

    /* Light Theme Adaptation */
    @media (prefers-color-scheme: light) {
      .g3-casing-bg { fill: #F7F6F2 !important; stroke: #0A5A78 !important; }
      .g3-bar-surface { stroke: #14212B !important; }
      .g3-bar-thermo { stroke: #0A5A78 !important; }
      .g3-bar-abyss { stroke: #0A5A78 !important; }
      .oe-ocean { fill: #14212B !important; }
      .oe-embed { fill: #0A5A78 !important; }
    }
  </style>

  <!-- Lockup Container (viewBox 610x116, translate 18, 10) -->
  <g transform="translate(18, 10)">
    <!-- Emblem Container (84x84) -->
    <g transform="translate(0, 0)">
      <!-- Ambient Oceanic Aura -->
      <ellipse cx="48" cy="48" rx="54" ry="54" fill="url(#g3-aura)" class="g3-aura"/>

      <!-- Clean Squircle Enclosure -->
      <rect x="6" y="6" width="84" height="84" rx="22"
            fill="url(#g3-water)"
            stroke="url(#g3-border)"
            stroke-width="4.5"
            stroke-linejoin="round"
            class="g3-casing-bg"/>

      <!-- Inner Subtle Border Highlight -->
      <rect x="9.5" y="9.5" width="77" height="77" rx="19"
            fill="none"
            stroke="#45C4D6"
            stroke-width="0.8"
            stroke-opacity="0.35"/>

      <!-- Layer 1: Sea Surface (0m) - Preserved Original White Color -->
      <line x1="22" y1="33" x2="74" y2="33"
            stroke="#FFFFFF"
            stroke-width="7.0"
            stroke-linecap="round"
            class="g3-bar-surface"/>

      <!-- Layer 2: Thermocline (50-200m) - Preserved Original Cyan Color -->
      <line x1="22" y1="48" x2="56" y2="48"
            stroke="#45C4D6"
            stroke-width="7.0"
            stroke-linecap="round"
            class="g3-bar-thermo"/>

      <!-- Layer 3: Abyss (1000m) - Preserved Original Deep Navy 55% -->
      <line x1="22" y1="63" x2="38" y2="63"
            stroke="#0A5A78"
            stroke-width="7.0"
            stroke-linecap="round"
            opacity="0.55"
            class="g3-bar-abyss"/>

      <!-- Vertical Sounding Beam (Downwards penetration line) -->
      <g class="g3-vertical-beam">
        <line x1="30" y1="20" x2="30" y2="44" stroke="url(#g3-beam-grad)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="30" cy="32" r="3.0" fill="#FFFFFF" filter="drop-shadow(0 0 6px #45C4D6)"/>
      </g>
    </g>

    <!-- Wordmark "OceanEmbed" (72px, guaranteed zero cutoff with 610px width) -->
    <text x="116" y="74" class="oe-wordmark">
      <tspan class="oe-ocean">Ocean</tspan><tspan class="oe-embed">Embed</tspan>
    </text>
  </g>
</svg>
